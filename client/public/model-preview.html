<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Preview - Warrior</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      color: #ffd700;
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
    }
    .viewer-container {
      width: 100%;
      max-width: 800px;
      height: 600px;
      background: #2a2a4a;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: relative;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #2a2a4a;
    }
    model-viewer::part(default-progress-bar) {
      background-color: #ffd700;
    }
    .loading-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffd700;
      font-size: 18px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 10;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 215, 0, 0.2);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      text-align: center;
    }
    .loading-hint {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }
    .controls {
      margin-top: 20px;
      color: #ccc;
      text-align: center;
    }
    .model-selector {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 800px;
    }
    .model-btn {
      padding: 8px 16px;
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid #ffd700;
      color: #ffd700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .model-btn:hover {
      background: rgba(255, 215, 0, 0.4);
    }
    .model-btn.active {
      background: #ffd700;
      color: #1a1a2e;
    }
  </style>
</head>
<body>
  <h1>3D Model Preview</h1>
  <div class="viewer-container">
    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Loading model...</div>
      <div class="loading-hint">Large models may take a few seconds</div>
    </div>
    <model-viewer
      id="viewer"
      src="./models/warrior.glb"
      alt="3D Model Preview"
      auto-rotate
      camera-controls
      shadow-intensity="1"
      exposure="1.2"
      camera-orbit="45deg 55deg 2.5m"
      min-camera-orbit="auto auto 0.5m"
      max-camera-orbit="auto auto 10m"
      field-of-view="30deg"
      loading="eager"
    ></model-viewer>
  </div>
  <div class="controls">
    Drag to rotate | Scroll to zoom | Shift+drag to pan
  </div>
  <div class="model-selector">
    <h3 style="width: 100%; color: #ffd700; margin-bottom: 10px;">Units:</h3>
    <button class="model-btn active" onclick="loadModel('./models/warrior.glb', this)">Warrior</button>
    <button class="model-btn" onclick="loadModel('./models/scout.glb', this)">Scout</button>
    <button class="model-btn" onclick="loadModel('./models/settler.glb', this)">Worker</button>
    <button class="model-btn" onclick="loadModel('./models/archer.glb', this)">Slinger</button>
    <button class="model-btn" onclick="loadModel('./models/spearman.glb', this)">Spearman</button>
    <button class="model-btn" onclick="loadModel('./models/commander.glb', this)">Commander</button>
    <button class="model-btn" onclick="loadModel('./models/cavalry.glb', this)">Cavalry</button>
    <button class="model-btn" onclick="loadModel('./models/catapult.glb', this)">Catapult</button>
    <button class="model-btn" onclick="loadModel('./models/missionary.glb', this)">Missionary</button>
    <button class="model-btn" onclick="loadModel('./models/prophet.glb', this)">Prophet</button>
  </div>
  <div class="model-selector">
    <h3 style="width: 100%; color: #ffd700; margin-bottom: 10px;">Improvements:</h3>
    <button class="model-btn" onclick="loadModel('./models/improvements/farm.glb', this)">Farm</button>
    <button class="model-btn" onclick="loadModel('./models/improvements/mine.glb', this)">Mine</button>
    <button class="model-btn" onclick="loadModel('./models/improvements/sawmill.glb', this)">Sawmill</button>
    <button class="model-btn" onclick="loadModel('./models/improvements/lumber_hut.glb', this)">Lumber Hut</button>
    <button class="model-btn" onclick="loadModel('./models/improvements/forest_camp.glb', this)">Forest Camp</button>
    <button class="model-btn" onclick="loadModel('./models/improvements/plantation.glb', this)">Plantation</button>
    <button class="model-btn" onclick="loadModel('./models/improvements/road.glb', this)">Road</button>
    <button class="model-btn" onclick="loadModel('./models/improvements/port.glb', this)">Port</button>
    <button class="model-btn" onclick="loadModel('./models/improvements/workshop.glb', this)">Workshop</button>
    <button class="model-btn" onclick="loadModel('./models/improvements/shrine.glb', this)">Shrine</button>
    <button class="model-btn" onclick="loadModel('./models/improvements/aqueduct.glb', this)">Aqueduct</button>
  </div>
  <div class="model-selector">
    <h3 style="width: 100%; color: #ffd700; margin-bottom: 10px;">Structures:</h3>
    <button class="model-btn" onclick="loadModel('./models/structures/temple.glb', this)">Temple</button>
    <button class="model-btn" onclick="loadModel('./models/structures/granary.glb', this)">Granary</button>
    <button class="model-btn" onclick="loadModel('./models/structures/fortress.glb', this)">Fortress</button>
    <button class="model-btn" onclick="loadModel('./models/structures/lighthouse.glb', this)">Lighthouse</button>
    <button class="model-btn" onclick="loadModel('./models/structures/cathedral.glb', this)">Cathedral</button>
    <button class="model-btn" onclick="loadModel('./models/structures/academy.glb', this)">Academy</button>
    <button class="model-btn" onclick="loadModel('./models/structures/library.glb', this)">Library</button>
  </div>
  <div class="model-selector">
    <h3 style="width: 100%; color: #ffd700; margin-bottom: 10px;">Cities & Villages:</h3>
    <button class="model-btn" onclick="loadModel('./models/village.glb', this)">Village</button>
    <button class="model-btn" onclick="loadModel('./models/city_level1.glb', this)">City Level 1</button>
    <button class="model-btn" onclick="loadModel('./models/city_level2.glb', this)">City Level 2</button>
    <button class="model-btn" onclick="loadModel('./models/city_level3.glb', this)">City Level 3</button>
  </div>
  <script>
    const viewer = document.getElementById('viewer');
    const loading = document.getElementById('loading');
    const loadingText = loading.querySelector('.loading-text');
    const spinner = loading.querySelector('.spinner');
    const hint = loading.querySelector('.loading-hint');
    let currentModelName = 'Warrior';
    
    viewer.addEventListener('load', () => {
      loading.style.display = 'none';
    });
    
    viewer.addEventListener('model-visibility', (e) => {
      if (e.detail.visible) {
        loading.style.display = 'none';
      }
    });
    
    viewer.addEventListener('error', (e) => {
      spinner.style.borderTopColor = '#ff6b6b';
      spinner.style.animation = 'none';
      loadingText.textContent = 'Error loading model';
      loadingText.style.color = '#ff6b6b';
      hint.textContent = 'Model file may be missing or corrupted';
    });
    
    function loadModel(path, btn) {
      const modelName = btn.textContent;
      currentModelName = modelName;
      
      loading.style.display = 'flex';
      spinner.style.borderTopColor = '#ffd700';
      spinner.style.animation = 'spin 1s linear infinite';
      loadingText.textContent = 'Loading ' + modelName + '...';
      loadingText.style.color = '#ffd700';
      hint.textContent = 'Large models may take a few seconds';
      hint.style.color = '#999';
      
      viewer.src = path;
      document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    
    viewer.addEventListener('progress', (e) => {
      const progress = e.detail.totalProgress;
      if (progress < 1) {
        const percent = Math.round(progress * 100);
        hint.textContent = 'Loading: ' + percent + '%';
        hint.style.color = '#ffd700';
      }
    });
  </script>
</body>
</html>
