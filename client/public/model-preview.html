<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Preview</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }
    h1 {
      color: #ffd700;
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
    }
    .viewer-container {
      width: 100%;
      max-width: 800px;
      height: 500px;
      background: #2a2a4a;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: relative;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    canvas { display: block; }
    .loading-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffd700;
      font-size: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 10;
    }
    .loading-overlay.hidden { display: none; }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 215, 0, 0.2);
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { text-align: center; }
    .loading-hint { font-size: 12px; color: #999; }
    .controls {
      margin-top: 15px;
      color: #ccc;
      text-align: center;
      font-size: 14px;
    }
    .model-selector {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 900px;
    }
    .model-selector h3 {
      width: 100%;
      color: #ffd700;
      margin-bottom: 5px;
      font-size: 14px;
    }
    .model-btn {
      padding: 6px 12px;
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid #ffd700;
      color: #ffd700;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 12px;
    }
    .model-btn:hover { background: rgba(255, 215, 0, 0.4); }
    .model-btn.active { background: #ffd700; color: #1a1a2e; }
    .current-model {
      color: #ffd700;
      margin-top: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>3D Model Preview</h1>
  <div class="viewer-container">
    <div id="canvas-container"></div>
    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-text">Loading Warrior...</div>
      <div class="loading-hint" id="loading-hint">Please wait...</div>
    </div>
  </div>
  <div class="current-model">Current: <span id="model-name">Warrior</span></div>
  <div class="controls">Drag to rotate | Scroll to zoom | Right-click drag to pan</div>
  
  <div class="model-selector">
    <h3>Units:</h3>
    <button class="model-btn active" data-model="/models/warrior.glb">Warrior</button>
    <button class="model-btn" data-model="/models/scout.glb">Scout</button>
    <button class="model-btn" data-model="/models/settler.glb">Worker</button>
    <button class="model-btn" data-model="/models/archer.glb">Slinger</button>
    <button class="model-btn" data-model="/models/spearman.glb">Spearman</button>
    <button class="model-btn" data-model="/models/commander.glb">Commander</button>
    <button class="model-btn" data-model="/models/cavalry.glb">Cavalry</button>
    <button class="model-btn" data-model="/models/catapult.glb">Catapult</button>
    <button class="model-btn" data-model="/models/missionary.glb">Missionary</button>
    <button class="model-btn" data-model="/models/prophet.glb">Prophet</button>
  </div>
  
  <div class="model-selector">
    <h3>Improvements:</h3>
    <button class="model-btn" data-model="/models/improvements/farm.glb">Farm</button>
    <button class="model-btn" data-model="/models/improvements/mine.glb">Mine</button>
    <button class="model-btn" data-model="/models/improvements/sawmill.glb">Sawmill</button>
    <button class="model-btn" data-model="/models/improvements/lumber_hut.glb">Lumber Hut</button>
    <button class="model-btn" data-model="/models/improvements/forest_camp.glb">Forest Camp</button>
    <button class="model-btn" data-model="/models/improvements/plantation.glb">Plantation</button>
    <button class="model-btn" data-model="/models/improvements/road.glb">Road</button>
    <button class="model-btn" data-model="/models/improvements/port.glb">Port</button>
    <button class="model-btn" data-model="/models/improvements/workshop.glb">Workshop</button>
    <button class="model-btn" data-model="/models/improvements/shrine.glb">Shrine</button>
    <button class="model-btn" data-model="/models/improvements/aqueduct.glb">Aqueduct</button>
    <button class="model-btn" data-model="/models/improvements/irrigation.glb">Irrigation</button>
  </div>
  
  <div class="model-selector">
    <h3>Structures:</h3>
    <button class="model-btn" data-model="/models/structures/temple.glb">Temple</button>
    <button class="model-btn" data-model="/models/structures/granary.glb">Granary</button>
    <button class="model-btn" data-model="/models/structures/fortress.glb">Fortress</button>
    <button class="model-btn" data-model="/models/structures/lighthouse.glb">Lighthouse</button>
    <button class="model-btn" data-model="/models/structures/cathedral.glb">Cathedral</button>
    <button class="model-btn" data-model="/models/structures/academy.glb">Academy</button>
    <button class="model-btn" data-model="/models/structures/library.glb">Library</button>
  </div>
  
  <div class="model-selector">
    <h3>Cities & Villages:</h3>
    <button class="model-btn" data-model="/models/village.glb">Village</button>
    <button class="model-btn" data-model="/models/city_level1.glb">City L1</button>
    <button class="model-btn" data-model="/models/city_level2.glb">City L2</button>
    <button class="model-btn" data-model="/models/city_level3.glb">City L3</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    let scene, camera, renderer, controls, currentModel;
    let isLoading = false;
    let pendingLoad = null;
    const container = document.getElementById('canvas-container');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');
    const loadingHint = document.getElementById('loading-hint');
    const modelNameEl = document.getElementById('model-name');
    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x2a2a4a);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(3, 2, 3);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      container.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 2;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(5, 10, 7);
      scene.add(directionalLight);

      const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
      backLight.position.set(-5, 5, -5);
      scene.add(backLight);

      window.addEventListener('resize', onResize);
      animate();
      loadModel('/models/warrior.glb', 'Warrior');
    }

    function onResize() {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function clearScene() {
      while(scene.children.length > 0) { 
        const obj = scene.children[0];
        if (obj.type === 'AmbientLight' || obj.type === 'DirectionalLight') {
          break;
        }
        scene.remove(obj);
        if (obj.traverse) {
          obj.traverse((child) => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) {
              if (Array.isArray(child.material)) {
                child.material.forEach(m => m.dispose());
              } else {
                child.material.dispose();
              }
            }
          });
        }
      }
      currentModel = null;
    }

    function removeCurrentModel() {
      if (currentModel) {
        scene.remove(currentModel);
        currentModel.traverse((child) => {
          if (child.geometry) child.geometry.dispose();
          if (child.material) {
            if (Array.isArray(child.material)) {
              child.material.forEach(m => m.dispose());
            } else {
              child.material.dispose();
            }
          }
        });
        currentModel = null;
      }
    }

    window.loadModel = function(path, name) {
      if (isLoading) {
        pendingLoad = { path, name };
        return;
      }
      
      isLoading = true;
      loading.classList.remove('hidden');
      loadingText.textContent = 'Loading ' + name + '...';
      loadingHint.textContent = 'Please wait...';
      loadingHint.style.color = '#999';
      modelNameEl.textContent = name;

      removeCurrentModel();

      loader.load(
        path,
        (gltf) => {
          removeCurrentModel();
          
          currentModel = gltf.scene;
          
          const box = new THREE.Box3().setFromObject(currentModel);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          
          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 2 / maxDim;
          currentModel.scale.setScalar(scale);
          
          currentModel.position.sub(center.multiplyScalar(scale));
          currentModel.position.y -= (box.min.y * scale);
          
          scene.add(currentModel);
          loading.classList.add('hidden');
          
          camera.position.set(3, 2, 3);
          controls.target.set(0, 0.5, 0);
          controls.update();
          
          isLoading = false;
          if (pendingLoad) {
            const { path: nextPath, name: nextName } = pendingLoad;
            pendingLoad = null;
            window.loadModel(nextPath, nextName);
          }
        },
        (progress) => {
          if (progress.total > 0) {
            const percent = Math.round((progress.loaded / progress.total) * 100);
            loadingHint.textContent = 'Loading: ' + percent + '%';
          }
        },
        (error) => {
          loadingText.textContent = 'Error loading model';
          loadingHint.textContent = error.message || 'File may be missing';
          loadingHint.style.color = '#ff6b6b';
          console.error('Error loading model:', error);
          isLoading = false;
          
          if (pendingLoad) {
            const { path: nextPath, name: nextName } = pendingLoad;
            pendingLoad = null;
            window.loadModel(nextPath, nextName);
          }
        }
      );
    }

    document.querySelectorAll('.model-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        window.loadModel(btn.dataset.model, btn.textContent);
      });
    });

    init();
  </script>
</body>
</html>
