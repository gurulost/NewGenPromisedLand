name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npx vitest run test/unit --coverage --coverage.reporter=text --coverage.reporter=json-summary --reporter=verbose
      
      - name: Coverage gate
        run: |
          MIN_COVERAGE=20
          COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          if [ -z "$COVERAGE" ] || [ "$COVERAGE" = "null" ]; then
            echo "Failed to read coverage summary."
            exit 1
          fi
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "Coverage $COVERAGE% is below ${MIN_COVERAGE}% threshold"
            exit 1
          fi

  accessibility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run accessibility tests
        run: npx vitest run test/a11y --reporter=verbose

  performance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run performance tests
        run: npx vitest run test/performance --reporter=verbose

  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run token snapshot tests
        run: npx vitest run test/visual --reporter=verbose

  responsive-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run responsive viewport tests
        run: npx vitest run test/responsive --reporter=verbose

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright
        run: npx playwright install --with-deps
      
      - name: Start development server
        run: |
          npm run dev &
          npx wait-on http://localhost:5000
        
      - name: Run E2E tests
        run: npx playwright test test/e2e --reporter=html
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  lighthouse-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Start production server
        run: |
          npm start &
          npx wait-on http://localhost:5000
      
      - name: Run Lighthouse audit
        run: |
          npm install -g @lhci/cli
          lhci autorun --config=lighthouserc.json

  merge-gate:
    runs-on: ubuntu-latest
    needs: [unit-tests, accessibility-tests, performance-tests, visual-regression, responsive-tests, e2e-tests]
    if: github.event_name == 'pull_request'
    steps:
      - name: All tests passed
        run: echo "All quality gates passed - ready to merge!"
