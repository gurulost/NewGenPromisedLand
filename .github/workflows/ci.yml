name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npx vitest run test/unit --coverage --coverage.reporter=text --coverage.reporter=json-summary --reporter=verbose
      
      - name: Coverage report
        run: |
          MIN_COVERAGE=20
          COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          if [ -z "$COVERAGE" ] || [ "$COVERAGE" = "null" ]; then
            echo "Failed to read coverage summary."
            exit 1
          fi
          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "Coverage $COVERAGE% is below ${MIN_COVERAGE}% threshold"
            exit 1
          fi

  accessibility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run accessibility tests
        run: npx vitest run test/a11y --reporter=verbose

  performance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run performance tests
        run: npx vitest run test/performance --reporter=verbose

  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run token snapshot tests
        run: npx vitest run test/visual --reporter=verbose

  responsive-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run responsive viewport tests
        run: npx vitest run test/responsive --reporter=verbose

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newgen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/newgen
      SESSION_SECRET: ci-e2e-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: npm run db:push
      
      - name: Install Playwright
        run: npx playwright install --with-deps
        
      - name: Run E2E tests
        run: npx playwright test test/e2e --reporter=html
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  lighthouse-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newgen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/newgen
      SESSION_SECRET: ci-lighthouse-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: npm run db:push
      
      - name: Build application
        run: npm run build
      
      - name: Start production server
        run: |
          npm start > /tmp/lighthouse-server.log 2>&1 &
          npx wait-on http://localhost:5000 --timeout 120000
      
      - name: Run Lighthouse audit
        continue-on-error: true
        run: |
          npm install -g @lhci/cli
          lhci autorun --config=lighthouserc.json

  merge-gate:
    runs-on: ubuntu-latest
    needs: [unit-tests, accessibility-tests, performance-tests, visual-regression, responsive-tests, e2e-tests]
    if: github.event_name == 'pull_request'
    steps:
      - name: All tests passed
        run: echo "All quality gates passed - ready to merge!"
