name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1-5'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  asset-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify Git LFS object integrity
        run: git lfs fsck

      - name: Verify public assets
        run: npm run assets:verify

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Verify public assets
        run: npm run assets:verify

      - name: Run production build
        run: npm run build

  vitest-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Verify public assets
        run: npm run assets:verify

      - name: Run Vitest suite
        run: npm run test:all

  map-generator-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run focused map generation suite
        run: npm run test:map

  performance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        run: npm run test:performance

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newgen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/newgen
      SESSION_SECRET: ci-e2e-session-secret
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Verify public assets
        run: npm run assets:verify

      - name: Apply database schema
        run: npm run db:push
      
      - name: Install Playwright
        run: npx playwright install --with-deps
        
      - name: Run Chromium E2E gate
        run: npm run test:e2e:chromium -- test/e2e --reporter=html
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  e2e-full-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newgen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/newgen
      SESSION_SECRET: ci-e2e-matrix-session-secret
      PLAYWRIGHT_FULL_MATRIX: 'true'
      PLAYWRIGHT_WORKERS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify public assets
        run: npm run assets:verify

      - name: Apply database schema
        run: npm run db:push

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run full browser E2E matrix
        continue-on-error: true
        run: npm run test:e2e:matrix -- test/e2e --reporter=html

      - name: Upload full matrix report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-full-matrix-report
          path: playwright-report/

  lighthouse-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newgen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/newgen
      SESSION_SECRET: ci-lighthouse-session-secret
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Verify public assets
        run: npm run assets:verify

      - name: Apply database schema
        run: npm run db:push
      
      - name: Build application
        run: npm run build

      - name: Run Lighthouse audit
        run: |
          npm install -g @lhci/cli
          lhci autorun --config=lighthouserc.json

  merge-gate:
    runs-on: ubuntu-latest
    needs: [typecheck, lint, asset-integrity, build, vitest-suite, map-generator-suite, performance-tests, e2e-tests, lighthouse-audit]
    if: github.event_name == 'pull_request'
    steps:
      - name: All tests passed
        run: echo "All quality gates passed - ready to merge!"
