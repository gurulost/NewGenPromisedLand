name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Verify Git LFS assets hydrated
        run: |
          if grep -RIl "version https://git-lfs.github.com/spec/v1" client/public; then
            echo "Found Git LFS pointer files in client/public. Ensure LFS assets are available before building release artifacts."
            exit 1
          fi

      - name: Run production build
        run: npm run build

  vitest-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Verify Git LFS assets hydrated
        run: |
          if grep -RIl "version https://git-lfs.github.com/spec/v1" client/public; then
            echo "Found Git LFS pointer files in client/public. Ensure LFS assets are available before running Vitest."
            exit 1
          fi

      - name: Run Vitest suite
        run: npm run test:all

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newgen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/newgen
      SESSION_SECRET: ci-e2e-session-secret
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Verify Git LFS assets hydrated
        run: |
          if grep -RIl "version https://git-lfs.github.com/spec/v1" client/public; then
            echo "Found Git LFS pointer files in client/public. Ensure LFS assets are available before running E2E tests."
            exit 1
          fi

      - name: Apply database schema
        run: npm run db:push
      
      - name: Install Playwright
        run: npx playwright install --with-deps
        
      - name: Run E2E tests
        run: npx playwright test test/e2e --reporter=html
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  lighthouse-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d newgen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/newgen
      SESSION_SECRET: ci-lighthouse-session-secret
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Verify Git LFS assets hydrated
        run: |
          if grep -RIl "version https://git-lfs.github.com/spec/v1" client/public; then
            echo "Found Git LFS pointer files in client/public. Ensure LFS assets are available before running Lighthouse."
            exit 1
          fi

      - name: Apply database schema
        run: npm run db:push
      
      - name: Build application
        run: npm run build
      
      - name: Start production server
        run: |
          npm start > /tmp/lighthouse-server.log 2>&1 &
          npx wait-on http://localhost:5000 --timeout 120000
      
      - name: Run Lighthouse audit
        run: |
          npm install -g @lhci/cli
          lhci autorun --config=lighthouserc.json

  merge-gate:
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, vitest-suite, e2e-tests, lighthouse-audit]
    if: github.event_name == 'pull_request'
    steps:
      - name: All tests passed
        run: echo "All quality gates passed - ready to merge!"
